name: Live Signals Scraper

on:
  schedule:
    # Runs every 45 minutes, Monday through Friday. Widened from 30 min once
    # the scraper started covering every leaderboard trader (~150, ~10s each)
    # instead of just the top 15 - a run now takes ~26-27 min, so 45 min
    # leaves a real buffer against concurrency-group queue pileup.
    #
    # 45 doesn't divide 60, so a single "*/45" minute field would only match
    # :00 and :45 each hour - an alternating 45min/15min gap, not a real
    # 45-min cadence. 45 *does* divide 1440 (a day) evenly, repeating every
    # 3 hours, so these four lines together give a genuine even 45-min
    # spacing all day: :00, :45, +1:30, +2:15, then the pattern repeats.
    - cron: '0 0,3,6,9,12,15,18,21 * * 1-5'
    - cron: '45 0,3,6,9,12,15,18,21 * * 1-5'
    - cron: '30 1,4,7,10,13,16,19,22 * * 1-5'
    - cron: '15 2,5,8,11,14,17,20,23 * * 1-5'
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: live-signals-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Cache sent signals
      uses: actions/cache@v4
      with:
        path: |
          sent_signals.json
          open_positions.json
          paper_ledger.json
        key: signals-cache-${{ github.run_id }}
        restore-keys: |
          signals-cache-
        save-always: true

    - name: Run scraper
      env:
        REBEL_EMAIL: ${{ secrets.REBEL_EMAIL }}
        REBEL_PASSWORD: ${{ secrets.REBEL_PASSWORD }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        python live_signals_scraper.py
