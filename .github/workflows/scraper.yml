name: Live Signals Scraper

on:
  schedule:
    # Runs every 15 minutes, Monday through Friday.
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: # Allows manual trigger

concurrency:
  group: live-signals-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Cache sent signals
      uses: actions/cache@v4
      with:
        path: |
          sent_signals.json
          open_positions.json
          paper_ledger.json
        key: signals-cache-${{ github.run_id }}
        restore-keys: |
          signals-cache-
        save-always: true

    - name: Run scraper
      env:
        REBEL_EMAIL: ${{ secrets.REBEL_EMAIL }}
        REBEL_PASSWORD: ${{ secrets.REBEL_PASSWORD }}
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        python live_signals_scraper.py
